name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm run build
      - name: Attach the built files to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          zip -q "flow-datepicker-${{ github.event.release.tag_name }}.zip" *.js *.css *.map
          gh release upload "${{ github.event.release.tag_name }}" \
            flow-datepicker.min.js flow-datepicker.min.css \
            flow-datepicker.js flow-datepicker.css \
            flow-datepicker.esm.js flow-datepicker.esm.min.js \
            "flow-datepicker-${{ github.event.release.tag_name }}.zip" \
            --clobber

  npm:
    needs: assets
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - name: Publish unless this version is already on npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "flow-datepicker@$VERSION" version > /dev/null 2>&1; then
            echo "flow-datepicker@$VERSION is already on npm, nothing to publish."
          else
            npm publish --provenance --access public
          fi
